<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios Poleni #2 - Pedidos de Mandaditos</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        #map {
            height: 280px;
            width: 100%;
            border-radius: 0.75rem;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header / Logo -->
    <header class="w-full max-w-md bg-slate-800 border border-slate-700 shadow-xl rounded-2xl p-5 mb-4 text-center">
        <div class="flex justify-center mb-3">
            <!-- Logotipo Motomandaditos SVG -->
            <svg class="w-20 h-20 text-yellow-400 drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="5" cy="18" r="3"/>
                <circle cx="19" cy="18" r="3"/>
                <path d="M5 15h3l3-7h4l3 7h2"/>
                <path d="M12 8v5"/>
                <path d="M9.5 8H15"/>
                <path d="M16 11l2-3 2 1"/>
                <path d="M7 11l-2-2"/>
            </svg>
        </div>
        <h1 class="text-2xl font-black tracking-wider text-yellow-400">SERVICIOS POLENI #2</h1>
        <p class="text-xs text-slate-400 uppercase tracking-widest mt-1">Mandaditos y Entregas Rápidas</p>
        <div class="mt-3 inline-flex items-center gap-2 bg-emerald-950/80 border border-emerald-600/50 px-3 py-1.5 rounded-full text-emerald-300 text-xs font-medium">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            WhatsApp: +52 963 174 5650
        </div>
    </header>

    <!-- Formulario de Pedido -->
    <main class="w-full max-w-md bg-slate-800 border border-slate-700 shadow-xl rounded-2xl p-5 space-y-4 flex-grow mb-4">
        <h2 class="text-lg font-bold text-slate-200 border-b border-slate-700 pb-2 flex items-center gap-2">
            <span>📝</span> Solicitar Servicio
        </h2>

        <!-- Nombre del Cliente -->
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Tu Nombre o Nombre de Quien Recibe *</label>
            <input type="text" id="clienteNombre" placeholder="Ej. Juan Pérez" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-yellow-400 text-sm">
        </div>

        <!-- Detalle del Mandadito -->
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">¿Qué mandadito o servicio necesitas? *</label>
            <textarea id="detalleServicio" rows="3" placeholder="Ej. Comprar 1 desayuno en Fonda Doña María y traerlo a..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-yellow-400 text-sm resize-none"></textarea>
        </div>

        <!-- Referencia de Dirección -->
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Referencia o calle de entrega *</label>
            <input type="text" id="referenciaCalle" placeholder="Ej. Calle Central #45, Col. Centro" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-yellow-400 text-sm">
        </div>

        <!-- Mapa interactivo -->
        <div>
            <div class="flex justify-between items-center mb-1">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Ubicación de Entrega en el Mapa:</label>
                <span id="gpsStatus" class="text-[10px] text-yellow-400 font-medium">GPS no activado</span>
            </div>
            <p class="text-[11px] text-slate-400 mb-2">Arrastra el pin o toca el mapa para afinar tu ubicación exacta:</p>
            <div id="map"></div>
        </div>

        <!-- Botón Enviar WhatsApp -->
        <button onclick="enviarPedidoWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 text-base">
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
            </svg>
            Enviar Pedido por WhatsApp
        </button>

        <!-- Botón Compartir App -->
        <button onclick="compartirApp()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-3 px-4 rounded-xl shadow transition duration-200 flex items-center justify-center gap-2 text-sm">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/>
            </svg>
            Compartir esta App 🚀
        </button>
    </main>

    <!-- Footer -->
    <footer class="text-xs text-slate-500 text-center py-2">
        Servicios Poleni #2 © 2026 • Todos los derechos reservados
    </footer>

    <!-- Script del Mapa y Lógica -->
    <script>
        // Coordenadas predeterminadas
        const defaultLat = 16.3275;
        const defaultLng = -91.9722;

        // Inicializar Mapa centrado
        const map = L.map('map').setView([defaultLat, defaultLng], 15);

        // Capa de mapas robusta compatible con Netlify
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            referrerPolicy: 'no-referrer-when-downgrade'
        }).addTo(map);

        // Crear Pin Arrastrable
        let marker = L.marker([defaultLat, defaultLng], {
            draggable: true
        }).addTo(map);

        // Actualizar coordenadas al arrastrar el marcador
        marker.on('dragend', function(e) {
            const pos = marker.getLatLng();
            selectedLat = pos.lat;
            selectedLng = pos.lng;
        });

        // Permitir clic en el mapa para mover el marcador
        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
            selectedLat = e.latlng.lat;
            selectedLng = e.latlng.lng;
        });

        let selectedLat = defaultLat;
        let selectedLng = defaultLng;

        // Intentar obtener la ubicación GPS real del usuario automáticamente
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    
                    map.setView([userLat, userLng], 16);
                    marker.setLatLng([userLat, userLng]);
                    selectedLat = userLat;
                    selectedLng = userLng;

                    document.getElementById('gpsStatus').innerText = "GPS Activo 📍";
                    document.getElementById('gpsStatus').className = "text-[10px] text-emerald-400 font-semibold";
                },
                function(error) {
                    console.warn("No se pudo obtener la geolocalización automáticamente.");
                    document.getElementById('gpsStatus').innerText = "Ubicación manual o predeterminada";
                },
                { timeout: 10000, enableHighAccuracy: true }
            );
        }

        // Función para Enviar por WhatsApp
        function enviarPedidoWhatsApp() {
            const nombre = document.getElementById('clienteNombre').value.trim();
            const detalle = document.getElementById('detalleServicio').value.trim();
            const referencia = document.getElementById('referenciaCalle').value.trim();

            if (!nombre || !detalle || !referencia) {
                alert("Por favor completa tu nombre, el detalle del servicio y la referencia o calle de entrega.");
                return;
            }

            const linkUbicacion = `https://maps.google.com/?q=${selectedLat},${selectedLng}`;

            const mensaje = `*🛵 NUEVO PEDIDO - SERVICIOS POLENI #2* 📦\n\n` +
                            `👤 *Cliente:* ${nombre}\n` +
                            `🛍️ *Servicio/Mandadito:* ${detalle}\n` +
                            `📍 *Referencia:* ${referencia}\n\n` +
                            `🗺️ *Ubicación en tiempo real (GPS):*\n${linkUbicacion}`;

            const telefonoDestino = "529631745650";
            const urlWhatsApp = `https://wa.me/${telefonoDestino}?text=${encodeURIComponent(mensaje)}`;

            window.open(urlWhatsApp, '_blank');
        }

        // Función para Compartir la App
        function compartirApp() {
            const shareData = {
                title: 'Servicios Poleni #2',
                text: '¡Pide tus mandaditos y entregas rápidas con ubicación en tiempo real en Servicios Poleni #2! 🛵📦 Pídelo aquí:',
                url: window.location.href
            };

            if (navigator.share) {
                navigator.share(shareData).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert("¡Enlace de la app copiado al portapapeles! Compártelo con tus amigos.");
                }).catch(() => {
                    prompt("Copia este enlace para compartir la app:", window.location.href);
                });
            }
        }
    </script>
</body>
</html>
